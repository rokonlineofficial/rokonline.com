name: Deploy Website

on:
  push:
    branches:
      - main # আপনার ব্রাঞ্চের নাম main না হয়ে master হলে এখানে master লিখবেন

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install # অথবা bun install ব্যবহার করলে bun এর কমান্ড দিবেন

      - name: Build Project
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .output/public/ # এখানে আপনার বিল্ড হওয়া ফোল্ডারের পাথ
          server-dir: public_html/   # হোস্টইঙ্গারের মেইন ফোল্ডার
